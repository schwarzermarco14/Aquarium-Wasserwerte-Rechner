<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaLab Pro - Wasseranalyse</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --card-border: #232f48;
      --primary: #00d2ff;
      --primary-dark: #0077ff;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      padding-bottom: 40px;
    }
    .header {
      text-align: center;
      padding: 15px 0 20px 0;
    }
    .header h1 {
      margin: 0;
      font-size: 1.6rem;
      background: linear-gradient(45deg, var(--primary), var(--primary-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 0;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .input-box {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .input-box label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .input-box input {
      background: #0b0f19;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
    }
    .input-box input:focus {
      border-color: var(--primary);
    }
    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
      margin-top: 10px;
    }
    .status-bar-wrap {
      margin-top: 12px;
    }
    .status-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 5px;
    }
    .bar-bg {
      height: 10px;
      background: #0b0f19;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.4s ease;
    }
    .diag-card {
      padding: 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-top: 10px;
      line-height: 1.4;
    }
    .diag-ok { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #6ee7b7; }
    .diag-warn { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); color: #fde047; }
    .diag-bad { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; }
  </style>
</head>
<body>

  <div class="header">
    <h1>💧 AquaLab Pro</h1>
    <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Professioneller Aquaristik-Analyseassistent</p>
  </div>

  <div class="card">
    <div class="card-title">📐 Beckendaten</div>
    <div class="grid-2">
      <div class="input-box">
        <label>Volumen (Liter)</label>
        <input type="number" id="vol" value="100">
      </div>
      <div class="input-box">
        <label>GH Gemessen (°dGH)</label>
        <input type="number" id="gh" value="10">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🌿 Pflanzennährstoffe (mg/L)</div>
    <div class="grid-2">
      <div class="input-box"><label>Nitrat (NO₃)</label><input type="number" id="no3" value="15"></div>
      <div class="input-box"><label>Phosphat (PO₄)</label><input type="number" id="po4" value="0.5"></div>
      <div class="input-box"><label>Kalium (K)</label><input type="number" id="k" value="10"></div>
      <div class="input-box"><label>Magnesium (Mg)</label><input type="number" id="mg" value="10"></div>
      <div class="input-box"><label>Calcium (Ca)</label><input type="number" id="ca" value="50"></div>
      <div class="input-box"><label>Eisen (Fe)</label><input type="number" id="fe" value="0.05"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">⚠️ Schadstoffe (mg/L)</div>
    <div class="grid-2">
      <div class="input-box"><label>Ammonium (NH₄)</label><input type="number" id="nh4" value="0"></div>
      <div class="input-box"><label>Nitrit (NO₂)</label><input type="number" id="no2" value="0"></div>
    </div>
  </div>

  <button class="btn-main" onclick="runAnalysis()">Vollständige Analyse Starten</button>

  <div id="results"></div>

  <script>
    function runAnalysis() {
      const vol = parseFloat(document.getElementById('vol').value) || 0;
      const gh = parseFloat(document.getElementById('gh').value) || 0;
      const no3 = parseFloat(document.getElementById('no3').value) || 0;
      const po4 = parseFloat(document.getElementById('po4').value) || 0;
      const k = parseFloat(document.getElementById('k').value) || 0;
      const mg = parseFloat(document.getElementById('mg').value) || 0;
      const ca = parseFloat(document.getElementById('ca').value) || 0;
      const nh4 = parseFloat(document.getElementById('nh4').value) || 0;
      const no2 = parseFloat(document.getElementById('no2').value) || 0;

      let out = '<div class="card"><div class="card-title">📊 Analyse-Ergebnisse</div>';

      // 1. Giftstoff-Prüfung
      if (nh4 > 0 || no2 > 0) {
        out += `<div class="diag-card diag-bad">
          <strong>🚨 GEFAHR FÜR FISCHE:</strong><br>
          Nachweisbare Giftstoffe (NH₄: ${nh4} mg/L, NO₂: ${no2} mg/L). Führe sofort 50% Wasserwechsel durch!
        </div>`;
      } else {
        out += `<div class="diag-card diag-ok">
          <strong>✅ Biologische Filterung stabil:</strong> Keine kritischen NH₄- oder NO₂-Werte festgestellt.
        </div>`;
      }

      // 2. Ca:Mg Verhältnis (Ideal 3:1 bis 4:1)
      if (mg > 0) {
        const caMgRatio = (ca / mg).toFixed(1);
        let ratioClass = 'diag-ok';
        let ratioMsg = `Das Calcium-Magnesium-Verhältnis beträgt <strong>${caMgRatio} : 1</strong>. (Ideal: 3:1 bis 4:1)`;
        
        if (caMgRatio < 2 || caMgRatio > 5) {
          ratioClass = 'diag-warn';
          ratioMsg += `<br>👉 <em>Empfehlung:</em> Passe das Verhältnis an, um Wuchsstörungen und Algenbildung vorzubeugen.`;
        }

        out += `<div class="diag-card ${ratioClass}">
          <strong>⚖️ Ca : Mg Verhältnis</strong><br>${ratioMsg}
        </div>`;
      }

      // 3. Redfield-Verhältnis (NO3 : PO4)
      if (po4 > 0) {
        const redfield = (no3 / po4).toFixed(1);
        let rfClass = 'diag-ok';
        let rfText = `Redfield-Verhältnis liegt bei <strong>${redfield} : 1</strong>. (Ideal: 10:1 bis 15:1)`;

        if (redfield < 8) {
          rfClass = 'diag-warn';
          rfText += `<br>⚠️ Phosphatüberschuss relativ zu Nitrat – erhöhtes Risiko für Punktalgen!`;
        } else if (redfield > 20) {
          rfClass = 'diag-warn';
          rfText += `<br>⚠️ Nitratüberschuss relativ zu Phosphat – erhöhtes Risiko für Fadenalgen!`;
        }

        out += `<div class="diag-card ${rfClass}">
          <strong>🌱 Redfield-Verhältnis (NO₃:PO₄)</strong><br>${rfText}
        </div>`;
      }

      // 4. GH Plausibilität
      const ghCalc = (ca * 0.14) + (mg * 0.23);
      if (Math.abs(gh - ghCalc) > 1.0) {
        out += `<div class="diag-card diag-warn">
          <strong>🔍 Tröpfchentest-Check:</strong><br>
          Aus Ca (${ca}) & Mg (${mg}) errechnet sich eine GH von <strong>${ghCalc.toFixed(1)}°dGH</strong>. Gemessen wurden ${gh}°dGH. Bitte Tests prüfen.
        </div>`;
      }

      out += '</div>';
      document.getElementById('results').innerHTML = out;
    }
  </script>
</body>
</html>
