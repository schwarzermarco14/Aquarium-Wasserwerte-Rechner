
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaLab Pro - Rechner & Diagnose</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --btn-red: #ef4444;
      --success: #10b981;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      padding-bottom: 60px;
    }
    .header { text-align: center; padding: 10px 0 15px; }
    .header h1 { font-size: 1.4rem; color: var(--accent); }
    .header p { font-size: 0.8rem; color: var(--text-muted); }

    /* Navigatios-Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 15px;
      background: #020617;
      padding: 4px;
      border-radius: 10px;
      overflow-x: auto;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      font-size: 0.75rem;
      font-weight: bold;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active { background: var(--accent); color: #0f172a; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2 {
      font-size: 0.95rem;
      color: var(--accent);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    /* Formularelemente */
    .form-group {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .form-group label { font-size: 0.85rem; flex: 1; padding-right: 10px; }
    .form-group input, .form-group select {
      width: 90px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
      text-align: right;
    }

    /* Checkboxen für Symptome */
    .check-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .check-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .calc-info {
      background: #020617;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--accent);
      margin-top: 8px;
      text-align: center;
    }

    /* Red Action Buttons */
    .btn-red {
      width: 100%;
      background: var(--btn-red);
      color: #fff;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-top: 8px;
      cursor: pointer;
    }

    .alert {
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 8px;
      line-height: 1.4;
    }
    .alert-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--btn-red); color: #fca5a5; }
    .alert-warn { background: rgba(245, 158, 11, 0.2); border: 1px solid var(--warn); color: #fde047; }
    .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--success); color: #6ee7b7; }
  </style>
</head>
<body>

  <div class="header">
    <h1>💧 AquaLab Pro</h1>
    <p>Wasserwerte & Symptom-Diagnose</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="openTab(event, 'tab-becken')">Becken & Technik</button>
    <button class="tab-btn" onclick="openTab(event, 'tab-wasser')">Wasserwerte</button>
    <button class="tab-btn" onclick="openTab(event, 'tab-symptome')">Symptome & Probleme</button>
  </div>

  <!-- TAB 1: BECKEN & TECHNIK -->
  <div id="tab-becken" class="tab-content active">
    <div class="card">
      <h2>📐 Becken-Abmessungen</h2>
      <div class="form-group"><label>Länge (cm):</label><input type="number" id="l" value="60" onchange="calcVol()"></div>
      <div class="form-group"><label>Breite (cm):</label><input type="number" id="b" value="30" onchange="calcVol()"></div>
      <div class="form-group"><label>Höhe (cm):</label><input type="number" id="h" value="36" onchange="calcVol()"></div>
      <div class="form-group"><label>Bodenhöhe / Soil (cm):</label><input type="number" id="soil" value="5" onchange="calcVol()"></div>
      <div class="calc-info" id="vol-res">Nettovolumen: ca. 55.8 Liter</div>
    </div>

    <div class="card">
      <h2>💡 Beleuchtung & Düngung</h2>
      <div class="form-group"><label>Lichtstärke (Lumen):</label><input type="number" id="lumen" value="2000"></div>
      <div class="form-group"><label>Beleuchtungsdauer (Std/Tag):</label><input type="number" id="licht_std" value="8"></div>
      <div class="form-group">
        <label>CO₂-Anlage:</label>
        <select id="co2"><option value="ja">Ja</option><option value="nein">Nein</option></select>
      </div>
      <div class="form-group"><label>Dünger (ml / Woche):</label><input type="number" id="duenger_ml" value="10"></div>
    </div>
  </div>

  <!-- TAB 2: WASSERWERTE -->
  <div id="tab-wasser" class="tab-content">
    <div class="card">
      <h2>🧪 Wasserwerte (Messung)</h2>
      <div class="form-group"><label>Gesamthärte (°dGH):</label><input type="number" id="gh" value="8"></div>
      <div class="form-group"><label>Karbonathärte (°dKH):</label><input type="number" id="kh" value="4"></div>
      <div class="form-group"><label>pH-Wert:</label><input type="number" id="ph" value="6.8" step="0.1"></div>
      <div class="form-group"><label>Calcium Ca (mg/L):</label><input type="number" id="ca" value="40"></div>
      <div class="form-group"><label>Magnesium Mg (mg/L):</label><input type="number" id="mg" value="10"></div>
      <div class="form-group"><label>Nitrat NO₃ (mg/L):</label><input type="number" id="no3" value="15"></div>
      <div class="form-group"><label>Phosphat PO₄ (mg/L):</label><input type="number" id="po4" value="0.5" step="0.1"></div>
      <div class="form-group"><label>Kalium K (mg/L):</label><input type="number" id="k" value="10"></div>
      <div class="form-group"><label>Eisen Fe (mg/L):</label><input type="number" id="fe" value="0.05" step="0.01"></div>
      <div class="form-group"><label>Ammonium NH₄ (mg/L):</label><input type="number" id="nh4" value="0"></div>
      <div class="form-group"><label>Nitrit NO₂ (mg/L):</label><input type="number" id="no2" value="0"></div>
    </div>
  </div>

  <!-- TAB 3: SYMPTOME & PROBLEME -->
  <div id="tab-symptome" class="tab-content">
    <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:10px;">Wählen Sie die Probleme aus, die Sie tatsächlich beobachten:</p>

    <div class="card">
      <h2>🟢 Algen</h2>
      <label class="check-group"><input type="checkbox" id="alg_faden"> Grüne Fadenalgen</label>
      <label class="check-group"><input type="checkbox" id="alg_punkt"> Grüne Punktalgen (GSA)</label>
      <label class="check-group"><input type="checkbox" id="alg_cyano"> Cyanobakterien (Blaualgen)</label>
      <label class="check-group"><input type="checkbox" id="alg_pinsel"> Pinselalgen / Bartalgen (BBA)</label>
      <label class="check-group"><input type="checkbox" id="alg_spiro"> Spirogyra</label>
      <label class="check-group"><input type="checkbox" id="alg_kiesel"> Kieselalgen</label>
      <label class="check-group"><input type="checkbox" id="alg_belag"> Grüner Belag auf den Scheiben</label>
      <label class="check-group"><input type="checkbox" id="alg_bluete"> Grüne Wasserblüte</label>
    </div>

    <div class="card">
      <h2>🌿 Pflanzen</h2>
      <label class="check-group"><input type="checkbox" id="pfl_keinwachstum"> Kein Wachstum</label>
      <label class="check-group"><input type="checkbox" id="pfl_verblassen"> Verblassen / Farbverlust</label>
      <label class="check-group"><input type="checkbox" id="pfl_loecher"> Löcher in den Blättern</label>
      <label class="check-group"><input type="checkbox" id="pfl_melt"> Blattzerfall / Pflanzenmelt</label>
      <label class="check-group"><input type="checkbox" id="pfl_faeule"> Stängelfäule</label>
      <label class="check-group"><input type="checkbox" id="pfl_gelb"> Vergilbende Blätter</label>
      <label class="check-group"><input type="checkbox" id="pfl_deformiert"> Kleine, deformierte neue Blätter</label>
      <label class="check-group"><input type="checkbox" id="pfl_abfall"> Abfallende untere Blätter</label>
    </div>

    <div class="card">
      <h2>🐟 Fische und Wirbellose</h2>
      <label class="check-group"><input type="checkbox" id="fisch_luft"> Schnappen nach Luft an der Wasseroberfläche</label>
      <label class="check-group"><input type="checkbox" id="fisch_teilnahme"> Teilnahmslosigkeit / Appetitlosigkeit</label>
      <label class="check-group"><input type="checkbox" id="fisch_tod"> Todesfälle in den letzten Tagen</label>
      <label class="check-group"><input type="checkbox" id="fisch_punkte"> Weiße Punkte oder Beläge</label>
      <label class="check-group"><input type="checkbox" id="fisch_flossen"> Ausgefranste oder sich auflösende Flossen</label>
    </div>

    <div class="card">
      <h2>💧 Wasser und Erscheinungsbild</h2>
      <label class="check-group"><input type="checkbox" id="w_trueb"> Trübes Wasser</label>
      <label class="check-group"><input type="checkbox" id="w_gelb"> Gelbe oder teefarbene Wasserfärbung</label>
      <label class="check-group"><input type="checkbox" id="w_belag_scheibe"> Mineralische Ablagerungen auf Scheiben</label>
      <label class="check-group"><input type="checkbox" id="w_geruch"> Unangenehmer Geruch</label>
      <label class="check-group"><input type="checkbox" id="w_biofilm"> Weißer Belag oder Biofilm auf Holz</label>
    </div>

    <button class="btn-red" onclick="runAnalysis()">Analysieren</button>
  </div>

  <div id="results"></div>

  <script>
    function openTab(evt, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }

    function calcVol() {
      const l = parseFloat(document.getElementById('l').value) || 0;
      const b = parseFloat(document.getElementById('b').value) || 0;
      const h = parseFloat(document.getElementById('h').value) || 0;
      const soil = parseFloat(document.getElementById('soil').value) || 0;

      const nettoH = Math.max(0, h - soil - 2);
      const nettoLiter = (l * b * nettoH) / 1000;
      document.getElementById('vol-res').innerText = `Nettovolumen: ca. ${nettoLiter.toFixed(1)} Liter`;
      return nettoLiter;
    }

    function runAnalysis() {
      let html = '<div class="card"><h2>📋 Diagnose & Handlungsempfehlungen</h2>';
      let count = 0;

      // Algen-Diagnosen
      if (document.getElementById('alg_faden').checked) {
        html += `<div class="alert alert-warn">⚠️ <strong>Grüne Fadenalgen:</strong> Oft verursacht durch Nitratmangel, Schwankungen beim CO₂-Gehalt oder plötzlichen Lichtüberschuss. Checke Nitrat & CO₂!</div>`;
        count++;
      }
      if (document.getElementById('alg_punkt').checked) {
        html += `<div class="alert alert-warn">⚠️ <strong>Grüne Punktalgen (GSA):</strong> Typisches Zeichen für Phosphatmangel (PO₄). Dünge gezielt Phosphat nach.</div>`;
        count++;
      }
      if (document.getElementById('alg_pinsel').checked) {
        html += `<div class="alert alert-warn">⚠️ <strong>Pinselalgen / Bartalgen:</strong> Deuten meist auf CO₂-Mangel, starke Strömung oder Eisenüberschuss hin.</div>`;
        count++;
      }
      if (document.getElementById('alg_cyano').checked) {
        html += `<div class="alert alert-danger">🚨 <strong>Cyanobakterien:</strong> Bakterielle Beläge. Dunkelkur (5-7 Tage) oder gründliches Absaugen sowie Anpassung der Mikroflora empfohlen.</div>`;
        count++;
      }

      // Pflanzen-Diagnosen
      if (document.getElementById('pfl_loecher').checked) {
        html += `<div class="alert alert-warn">🌱 <strong>Löcher in den Blättern:</strong> Häufiges Symptom für Kaliummangel (K). Kaliumdünger leicht erhöhen.</div>`;
        count++;
      }
      if (document.getElementById('pfl_gelb').checked) {
        html += `<div class="alert alert-warn">🌱 <strong>Vergilbende Blätter:</strong> Typischer Eisenmangel (Fe) oder Nitratmangel. Chlorose der Blätter prüfen.</div>`;
        count++;
      }

      // Fisch-Diagnosen
      if (document.getElementById('fisch_luft').checked) {
        html += `<div class="alert alert-danger">🚨 <strong>Schnappen nach Luft:</strong> Akuter Sauerstoffmangel oder Nitrit-/CO₂-Vergiftung! Sofort 50-70% Wasser wechseln und durchlüften.</div>`;
        count++;
      }

      if (count === 0) {
        html += `<div class="alert alert-success">✅ Keine auffälligen Symptome ausgewählt. Passe ggf. die Wasserwerte in Tab 2 an.</div>`;
      }

      html += '</div>';
      document.getElementById('results').innerHTML = html;
    }

    calcVol();
  </script>
</body>
</html>
